# Layers add hooks as fragments under .lefthook/ (gitleaks from +public).
# .lefthookrc puts brew's rustup proxies on PATH so the cargo hooks resolve.
rc: .lefthookrc
extends:
  - .lefthook/*.yml

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: '*.{ts,tsx,js,mjs,json,md,css,yml,yaml}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    rustfmt:
      glob: 'apps/desktop/src-tauri/**/*.rs'
      run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    verify:
      run: pnpm verify
