# scuttler agent screen rules (rules.rs). Format and shapes recorded from herdr's public
# catalogue, herdr.dev/agent-detection, 2026-11-06 (its binary is Apache-2.0; the
# catalogue files carry no licence text: STATUS, Needs Mitch). Strings are the agent's
# own UI text. A wrong cell is a captured screen and a new rule here, with a test.

id = "kilo"
version = "2026.11.06.1"
aliases = ["kilo-code", "kilo code"]

[[rules]]
id = "opencode_permission"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[rules]]
id = "esc_interrupt_working"
state = "working"
priority = 100
region = "whole_recent"
contains = ["esc interrupt"]
