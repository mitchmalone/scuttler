# scuttler agent screen rules (rules.rs). Derived from herdr's agent-detection catalogue
# (herdr.dev/agent-detection, Apache License 2.0; see THIRD-PARTY-LICENSES.md) and modified
# for scuttler's rule engine on 2026-11-06. Strings are the agent's own UI text. A wrong
# cell is a captured screen and a new rule here, with a test.

id = "opencode"
version = "2026.11.06.1"
aliases = ["open-code"]

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["△ Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }], all = [{ any = [{ contains = ["↑↓ select"] }, { contains = ["⇆ tab"] }] }] },
]

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "whole_recent"
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["press esc to interrupt"] },
  { line_regex = ['(?i).*opencode.*esc (again to )?interrupt'] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "whole_recent"
regex = ['(■|⬝){4,}']
