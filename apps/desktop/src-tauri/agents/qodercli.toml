# scuttler agent screen rules (rules.rs). Derived from herdr's agent-detection catalogue
# (herdr.dev/agent-detection, Apache License 2.0; see THIRD-PARTY-LICENSES.md) and modified
# for scuttler's rule engine on 2026-11-06. Strings are the agent's own UI text. A wrong
# cell is a captured screen and a new rule here, with a test.

id = "qodercli"
version = "2026.11.06.1"
aliases = ["qoderclicn", "qoder", "qodercn"]

[[rules]]
id = "confirmation_or_input_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["waiting for user confirmation"], any = [{ contains = ["yes"] }, { contains = ["no"] }, { contains = ["allow"] }, { contains = ["reject"] }] },
  { contains = ["awaiting approval"], any = [{ contains = ["allow"] }, { contains = ["reject"] }] },
  { contains = ["permission required"] },
  { contains = ["allow once or always?"] },
  { contains = ["asking user"] },
  { contains = ["enter your response"] },
  { contains = ["review your answers:"] },
  { contains = ["shell awaiting input"] },
]

[[rules]]
id = "cancel_hint_working"
state = "working"
priority = 100
region = "whole_recent"
contains = ["(esc to cancel,"]

[[rules]]
id = "spinner_working"
state = "working"
priority = 90
region = "whole_recent"
line_regex = ['^\s*[⠀-⣿]\s+.*\p{Alphabetic}']
