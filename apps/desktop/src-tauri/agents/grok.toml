# scuttler agent screen rules (rules.rs). Format and shapes recorded from herdr's public
# catalogue, herdr.dev/agent-detection, 2026-11-06 (its binary is Apache-2.0; the
# catalogue files carry no licence text: STATUS, Needs Mitch). Strings are the agent's
# own UI text. A wrong cell is a captured screen and a new rule here, with a test.

id = "grok"
version = "2026.11.06.1"
aliases = ["grok-build"]

# Titles: idle is "grok" or "<session> - grok"; a turn adds a braille spinner;
# permission prompts add "Action Required". Working turns draw one live status
# line above the prompt box ending in a [stop] chip; dialogs draw a "┃"-guttered
# option list. The startup splash is drawn in braille, so working rules anchor
# on the [stop] chip, not a bare spinner glyph.

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1300
region = "osc_title"
contains = ["Action Required"]

[[rules]]
id = "option_dialog_blocked"
state = "blocked"
priority = 1200
region = "whole_recent"
line_regex = ['^\s*┃\s+[0-9a-z]+\s+\([●○]\)\s']

[[rules]]
id = "permission_hints_blocked"
state = "blocked"
priority = 1190
region = "bottom_non_empty_lines(2)"
contains = [":select", "ctrl+o:yolo", "ctrl+c:cancel"]

[[rules]]
id = "question_dialog_hints_blocked"
state = "blocked"
priority = 1185
region = "bottom_non_empty_lines(2)"
contains = ["tab:scrollback", "shift+x:dismiss"]

[[rules]]
id = "permission_scope_selector"
state = "blocked"
priority = 1180
region = "whole_recent"
contains = ["yes, proceed", "no, reject"]
any = [
  { contains = ["use ← → to choose permission whitelist scope"] },
  { contains = ["←/→:scope"] },
]

[[rules]]
id = "spinner_status_working"
state = "working"
priority = 1160
region = "whole_recent"
line_regex = ['^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$']

[[rules]]
id = "esc_cancel_hints_working"
state = "working"
priority = 1155
region = "bottom_non_empty_lines(2)"
contains = ["ctrl+.:shortcuts"]
any = [
  { contains = ["esc:cancel"] },
  { contains = ["ctrl+c:cancel"] },
]

[[rules]]
id = "waiting_tool_working"
state = "working"
priority = 1140
region = "whole_recent"
any = [
  { all = [{ contains = ["ctrl+c:cancel", "ctrl+enter:interject"] }, { contains = ["waiting"] }] },
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+(Run|Read|Search|List)\b'] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 1100
region = "osc_title"
regex = ['(?:^| - )grok$']
not = [
  { regex = ['[\x{2800}-\x{28FF}]'] },
]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1000
region = "osc_title"
regex = ['(?:^|\s)[\x{2801}-\x{28FF}](?:\s|$)']

[[rules]]
id = "prompt_hints_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(2)"
contains = ["ctrl+.:shortcuts"]
not = [
  { contains = ["esc:cancel"] },
  { contains = ["ctrl+c:cancel"] },
]
