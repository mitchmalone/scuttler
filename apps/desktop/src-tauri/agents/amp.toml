# scuttler agent screen rules (rules.rs). Format and shapes recorded from herdr's public
# catalogue, herdr.dev/agent-detection, 2026-11-06 (its binary is Apache-2.0; the
# catalogue files carry no licence text: STATUS, Needs Mitch). Strings are the agent's
# own UI text. A wrong cell is a captured screen and a new rule here, with a test.

id = "amp"
version = "2026.11.06.1"
aliases = ["amp-local"]

[[rules]]
id = "osc_title_plugin_confirmation_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
contains = ["Plugin confirmation needed"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
regex = ['^[\x{2800}-\x{28FF}] ']

[[rules]]
id = "approval_footer"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["waiting for approval"] },
  { contains = ["invoke tool"] },
  { contains = ["run this command?"] },
  { contains = ["allow editing file:"] },
  { contains = ["allow creating file:"] },
  { contains = ["confirm tool call"] },
  { contains = ["approve"], any = [{ contains = ["allow all for this session"] }, { contains = ["allow all for every session"] }, { contains = ["allow file for every session"] }, { contains = ["deny with feedback"] }] },
]

[[rules]]
id = "status_footer_working"
state = "working"
priority = 200
region = "bottom_non_empty_lines(5)"
line_regex = ['(?i)^\s*╰\s+\S+\s+(thinking|streaming|running tools|waiting)\s+─']

[[rules]]
id = "esc_cancel_working"
state = "working"
priority = 100
region = "whole_recent"
contains = ["esc to cancel"]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 50
region = "osc_title"
contains = [" - amp - "]
not = [
  { regex = ['^[\x{2800}-\x{28FF}] '] },
  { contains = ["Plugin confirmation needed"] },
]
